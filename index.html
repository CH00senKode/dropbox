<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="css/styles.css">

    <link rel="stylesheet" href="css/components.css">

  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Dropbox home">
        <svg class="title-bar-icon__svg" alt="Dropbox" xmlns="http://www.w3.org/2000/svg" role="img" width="32px" height="32px" viewBox="0 0 32 32"><title>Dropbox</title><path d="M8 2.4l8 5.1-8 5.1-8-5.1 8-5.1zm16 0l8 5.1-8 5.1-8-5.1 8-5.1zM0 17.7l8-5.1 8 5.1-8 5.1-8-5.1zm24-5.1l8 5.1-8 5.1-8-5.1 8-5.1zM8 24.5l8-5.1 8 5.1-8 5.1-8-5.1z" /></svg>
      </a>
      <nav class="top-actions" aria-label="Account options">
        <div class="help-control"><button class="icon-button" type="button" aria-label="Help" aria-controls="help-menu" aria-expanded="false"><svg fill="none" viewBox="0 0 24 24" width="24" height="24" role="presentation" focusable="false"><path fill="currentColor" d="M11.75 4C6.535 4 4 6.535 4 11.75s2.535 7.75 7.75 7.75 7.75-2.535 7.75-7.75S16.965 4 11.75 4m0 14c-4.322 0-6.25-1.927-6.25-6.25 0-4.322 1.928-6.25 6.25-6.25 4.323 0 6.25 1.928 6.25 6.25 0 4.323-1.927 6.25-6.25 6.25" vector-effect="non-scaling-stroke"/><path fill="currentColor" d="M11.75 14.5a.75.75 0 1 0 .75.75.71.71 0 0 0-.75-.75m.007-7h-.007A2.76 2.76 0 0 0 9 10.26v.24h1.5v-.24A1.256 1.256 0 0 1 11.75 9c.866 0 1.25.386 1.25 1.25 0 .887-.443 1.074-.588 1.136A2.24 2.24 0 0 0 11 13.428v.166a3 3 0 0 1 1.5 0v-.166a.75.75 0 0 1 .496-.66A2.53 2.53 0 0 0 14.5 10.25a2.55 2.55 0 0 0-2.743-2.75" vector-effect="non-scaling-stroke"/></svg></button><div class="help-menu" id="help-menu" role="menu" hidden><a role="menuitem" href="https://help.dropbox.com/" target="_blank" rel="noopener noreferrer">Help center</a><a role="menuitem" href="https://www.dropbox.com/privacy" target="_blank" rel="noopener noreferrer">Privacy and legal</a><a role="menuitem" href="https://www.dropbox.com/privacy#privacy-page" target="_blank" rel="noopener noreferrer">Cookie &amp; CCPA preferences</a><a role="menuitem" href="https://www.dropbox.com/report_abuse" target="_blank" rel="noopener noreferrer">Report an issue</a></div></div>
        <a class="account-button login" data-field="loginLink" href="#">Log in</a>
        <a class="account-button signup" data-field="signupLink" href="#">Sign up</a>
      </nav>
    </header>

    <section class="share-banner" id="share-banner" aria-label="Shared folder notice">
      <img class="rocket" src="images/banner-rocket.svg" alt="">
      <span><strong data-field="sharedBy">Alejandro Chavez</strong> shared this folder. Want to do more with it?</span>
      <a class="banner-login" data-field="loginLink" href="#">Log in</a>
      <a class="banner-signup" data-field="signupLink" href="#">Sign up</a>
      <button class="banner-close" id="close-banner" type="button" aria-label="Close notice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17.5 6.5-11 11m11 0-11-11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10"/></svg></button>
    </section>

    <main class="page-shell">
      <div class="folder-actions" aria-label="Folder actions">
        <button class="action-card pale" data-action="copy" type="button">
          <span class="card-icon lottie-icon" data-animation="images/copy-707278d2632a79aa-vflppPUFm.json" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4h11v12H8zM5 8v12h11" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span>Copy to Dropbox</span>
        </button>
        <button class="action-card secondary" data-action="download" type="button">
          <span class="card-icon lottie-icon" data-animation="images/download-aa61b4ac7c985cdc-vfl2n8gAO.json" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Download</span>
        </button>
        <button class="action-card secondary" data-action="copy-link" type="button">
          <span class="card-icon lottie-icon" data-animation="images/copy-link.json" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m10 13 4-4m-7.2 8.2-1.1 1.1a3 3 0 0 1-4.2-4.2l4-4a3 3 0 0 1 4.2 0m4.5 4a3 3 0 0 1 0 4.2l-4 4a3 3 0 0 1-4.2-4.2l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span>Copy link</span>
        </button>
      </div>

      <section class="folder-area" aria-label="Folder contents">
        <div class="folder-heading">
          <h1 data-testid="sl-folder-title" data-field="folderName">GM Parts Photos</h1>
          <button class="view-toggle" id="view-toggle" type="button" aria-label="Change file view"><svg class="view-grid-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.99 5.066H5.02v5.939h5.97zm0 7.929H5.02v5.939h5.97zm7.99-7.929h-5.97v5.939h5.97zm0 7.929h-5.97v5.939h5.97z"/></svg><svg class="view-caret-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5.25 9.25 6.5 6.25 6.5-6.25" stroke="currentColor" stroke-miterlimit="10" stroke-width="1.5"/></svg></button>
        </div>
        <div class="file-table" role="table">
          <div class="table-head" role="row"><button class="name-col" type="button"><span>Name</span><svg class="sort-icon" fill="none" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path stroke="currentColor" stroke-miterlimit="10" stroke-width="1.5" d="M11.75 19V7m-6.5 5.25L11.75 6l6.5 6.25" vector-effect="non-scaling-stroke"/></svg></button><button type="button"><span>Modified</span></button><button type="button"><span>Size</span></button></div>
          <div class="file-row" data-testid="ROW_TEST_ID" role="row">
            <span class="file-name"><a data-field="itemLink" href="#"><span class="folder-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="26" fill="none" viewBox="0 0 30 26" role="none" focusable="false" data-testid="DIG-FOLDER-ICON-COMPATIBILITY-SVG"><path fill="#75AAFF" d="M9.502.004c.552.018.993.252 1.295.7l.785 2.12c.145.298.363.576.561.779.252.257.633.4 1.156.4H30l-.002 18c-.027.976-.3 1.594-.836 2.142-.565.577-1.383.858-2.41.858H3.248c-1.026 0-1.844-.28-2.409-.858C.274 23.568 0 22.73 0 21.68V.003z"/><path fill="#A0C4FF" d="M9.502.001c.552.018.993.252 1.295.7l.785 2.12c.145.298.363.576.561.779.252.257.633.4 1.156.4H30l-.002 16.84c-.027.976-.3 1.754-.836 2.302-.565.577-1.383.858-2.41.858H3.248c-1.026 0-1.844-.28-2.409-.858C.274 22.565 0 21.727 0 20.677V0z"/></svg></span><span data-field="itemName">damaged photos</span></a></span>
            <span data-field="modified">--</span><span data-field="size">--</span>
            <div class="row-hover-actions" aria-label="File actions">
              <button class="row-hover-action" data-action="row-copy" type="button" aria-label="Copy to Dropbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h11v12H8zM5 8v12h11" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Copy to Dropbox</span></button>
              <button class="row-hover-action" data-action="row-download" type="button" aria-label="Download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download</span></button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <button class="bottom-report" type="button" aria-label="Report"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" d="M13.508 7.37a.72.72 0 0 1-.785-.58A2.23 2.23 0 0 0 10.539 5H6v15h1.5v-6h3.04a.73.73 0 0 1 .71.585 2.217 2.217 0 0 0 2.395 1.779L18 15.988V6.983zm2.992 7.242-2.992.259a.725.725 0 0 1-.785-.58 2.23 2.23 0 0 0-2.184-1.791H7.5v-6h3.04a.73.73 0 0 1 .71.585 2.21 2.21 0 0 0 2.395 1.779l2.855-.247z"/></svg></button>
    <div class="auth-overlay" id="folder-preview-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title" hidden>
      <section class="auth-dialog">
        <button class="auth-close" type="button" aria-label="Close sign in dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17.5 6.5-11 11m11 0-11-11" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <div class="auth-avatars" aria-hidden="true"><span class="auth-initials">AC</span><span class="auth-person"><svg viewBox="0 0 80 80"><circle cx="40" cy="31" r="16" fill="#175b70"/><path d="M10 73c1-19 13-29 30-29s29 10 30 29" fill="#175b70"/></svg></span></div>
        <h2 id="auth-title">Join Alejandro Chavez on Dropbox</h2>
        <p class="auth-subtitle">Log in or sign up</p>

          <button type="button" class="auth-provider"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f25022" d="M2 2h9v9H2z"/><path fill="#7fba00" d="M13 2h9v9h-9z"/><path fill="#00a4ef" d="M2 13h9v9H2z"/><path fill="#ffb900" d="M13 13h9v9h-9z"/></svg><span>Continue with Microsoft</span></button>
        </div>
        <div class="auth-divider"><span>or</span></div>
        <label class="auth-email">Email<input type="email" autocomplete="email"></label>
        <button class="auth-continue" type="button">Continue</button>
      </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
